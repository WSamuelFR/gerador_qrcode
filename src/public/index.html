<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Referência ao arquivo CSS personalizado -->
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
  <h1>Gerador de QR Code</h1>
  
  <form @submit.prevent="generateQRCode" id="qrCodeForm">
    <div class="mb-3">
      <label for="link" class="form-label">Insira o Link:</label>
      <input type="text" class="form-control" v-model="link" required placeholder="http://example.com">
    </div>

    <button type="submit" class="btn btn-primary">Gerar QR Code</button>
  </form>

  <h2>QR Code Gerado:</h2>
  <img id="qrCodeImage" alt="QR Code" />
  
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Bootstrap JS e dependências -->
<script src="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>

<!-- Referência ao arquivo JavaScript personalizado -->
<script src="assets/js/ponte.js"></script>
</body>
</html>
