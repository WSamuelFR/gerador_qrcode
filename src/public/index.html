<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator - Premium</title>
  
  <!-- Google Fonts - Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Referência ao arquivo CSS personalizado -->
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<!-- Animated background blobs -->
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>

<div class="app-container">
  <div class="glass-card">
    <div class="card-header text-center">
      <div class="icon-wrapper">
        <i data-lucide="qr-code"></i>
      </div>
      <h1>QR Code <span>Creator</span></h1>
      <p class="subtitle">Insira um link para gerar um QR Code personalizado instantaneamente.</p>
    </div>
    
    <form id="qrCodeForm">
      <div class="form-group">
        <label for="link" class="form-label">Insira o Link:</label>
        <div class="input-wrapper">
          <i data-lucide="link-2" class="input-icon"></i>
          <input type="url" class="form-control" id="link" required placeholder="https://exemplo.com.br" autocomplete="off">
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary">
        <span class="btn-text">Gerar QR Code</span>
        <span class="btn-loader" style="display: none;">
          <i data-lucide="loader-2" class="spinner"></i> Gerando...
        </span>
      </button>
    </form>

    <!-- QR Code Result Section (Initially Hidden) -->
    <div id="resultContainer" class="result-container hidden">
      <div class="divider"></div>
      <h2>QR Code Gerado!</h2>
      <div class="qr-frame">
        <img id="qrCodeImage" alt="QR Code Gerado" />
      </div>
      
      <div class="action-buttons">
        <button id="downloadBtn" class="btn btn-secondary">
          <i data-lucide="download"></i> Download PNG
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Lucide Icons CDN -->
<script src="https://unpkg.com/lucide@latest"></script>
<!-- Referência ao arquivo JavaScript personalizado -->
<script src="assets/js/ponte.js"></script>
</body>
</html>
